      id: 21, section: 4,
      q: "秋天校園中的臺灣欒樹，果實薄如紙囊、非常輕盈，主要是利用哪種自然力量傳播種子？",
      options: ["磁力吸引", "風力吹送", "動物鉤刺", "水力漂浮"],
      ans: 1,
      exp: "臺灣欒樹的囊狀紙質果實構造輕盈，能隨秋風飄飛至遠處，屬於利用「風力」傳播種子。"
    },
    {
      id: 22, section: 4,
      q: "大花咸豐草的果實末端具有倒鉤刺，主要透過什麼方式將種子帶往遠方？",
      options: ["靠果實自身噴射到十公尺外", "附著在人類衣物或動物毛皮上被攜帶", "在河流湖泊上隨波漂流", "在泥土中自行向下鑽洞"],
      ans: 1,
      exp: "大花咸豐草的瘦果頂端有倒鉤刺，人畜經過時容易附著在衣服或毛皮上被帶到遠處散播。"
    },
    {
      id: 23, section: 4,
      q: "學校午餐的五穀飯、綠豆湯中的「糙米」與「綠豆」，在植物構造上屬於哪一部位？",
      options: ["根", "莖", "葉", "種子"],
      ans: 3,
      exp: "糙米、綠豆、紅豆、玉米粒都是植物的「種子」，富含養分，也是人類重要的糧食來源。"
    },
    {
      id: 24, section: 4,
      q: "種子在適當的水分、空氣與溫度條件下會發芽生長，這項特徵代表植物具備哪種生命現象？",
      options: ["排泄廢物", "繁衍後代以延續生命", "四處奔跑躲避敵人", "自行發光照明"],
      ans: 1,
      exp: "種子萌發出新幼苗長成新個體，正是植物為了繁衍後代、延續生命所展現的核心生命現象。"
    }
  ];

  // 動態渲染題目
  function renderQuiz() {
    quizData.forEach((q, idx) => {
      const container = document.getElementById(`q-container-${q.section}`);
      const card = document.createElement("div");
      card.className = "q-card";
      card.id = `card-${idx}`;

      const optionsHtml = q.options.map((opt, oIdx) => `
        <label class="option-item" id="opt-label-${idx}-${oIdx}">
          <input type="radio" name="q${idx}" value="${oIdx}" onchange="selectOption(${idx}, ${oIdx})">
          <span>${['①', '②', '③', '④'][oIdx]} ${opt}</span>
        </label>
      `).join("");

      card.innerHTML = `
        <div class="q-title">
          <span class="q-badge">第 ${idx + 1} 題</span>
          <span>${q.q}</span>
        </div>
        <div class="options">
          ${optionsHtml}
        </div>
        <div class="explanation" id="exp-${idx}">
          <div class="exp-correct">正確答案：${['①', '②', '③', '④'][q.ans]} ${q.options[q.ans]}</div>
          <div class="exp-text">💡 重點解析：${q.exp}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // 記錄使用者作答
  const userAnswers = {};

  function selectOption(qIdx, oIdx) {
    userAnswers[qIdx] = oIdx;
    playBeep(440, 0.05);

    // 更新樣式
    for (let i = 0; i < 4; i++) {
      const label = document.getElementById(`opt-label-${qIdx}-${i}`);
      if (label) label.classList.toggle("selected", i === oIdx);
    }
    updateProgress();
  }

  function updateProgress() {
    const answeredCount = Object.keys(userAnswers).length;
    document.getElementById("progressText").textContent = `已作答：${answeredCount} / ${quizData.length}`;
  }

  function scrollToSec(id) {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth' });
  }

  // 音效合成 Web Audio API
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  function playBeep(freq, duration) {
    try {
      const ctx = getAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playVictorySound() {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      setTimeout(() => playBeep(freq, 0.2), i * 140);
    });
  }

  function playTrySound() {
    [400, 350, 300].forEach((freq, i) => {
      setTimeout(() => playBeep(freq, 0.18), i * 160);
    });
  }

  // 送出測驗
  function submitQuiz() {
    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < quizData.length) {
      const confirmSubmit = confirm(`您還有 ${quizData.length - answeredCount} 題尚未作答，確定現在就要送出結算嗎？`);
      if (!confirmSubmit) return;
    }

    let correctCount = 0;

    quizData.forEach((q, idx) => {
      const card = document.getElementById(`card-${idx}`);
      const exp = document.getElementById(`exp-${idx}`);
      const userAns = userAnswers[idx];

      card.classList.remove("is-correct", "is-wrong");
      exp.classList.add("show");

      if (userAns === q.ans) {
        correctCount++;
        card.classList.add("is-correct");
      } else {
        card.classList.add("is-wrong");
      }
    });

    // 結算與評語
    const scoreNum = document.getElementById("scoreNum");
    const modalBadge = document.getElementById("modalBadge");
    const modalMsg = document.getElementById("modalMsg");
    const modalIcon = document.getElementById("modalIcon");

    scoreNum.innerHTML = `${correctCount} <span style="font-size: 1.5rem; color: #888;">/ ${quizData.length}</span>`;

    if (correctCount === 24) {
      modalIcon.textContent = "🏆";
      modalBadge.style.background = "#e8f5e9";
      modalBadge.style.color = "#2e7d32";
      modalBadge.textContent = "植物繁衍特級大師";
      modalMsg.textContent = "太驚人了！24 題全部答對！\n你對花的構造、傳粉受精以及果實種子功能完全精通，表現無懈可擊！";
      playVictorySound();
    } else if (correctCount >= 20) {
      modalIcon.textContent = "🌟";
      modalBadge.style.background = "#e3f2fd";
      modalBadge.style.color = "#1565c0";
      modalBadge.textContent = "自然探索小博士";
      modalMsg.textContent = "太棒了！答對了大部分的題目！\n只差一點點就滿分囉，看看下面的解析，把觀念弄清楚再挑戰一次吧！";
      playVictorySound();
    } else if (correctCount >= 14) {
      modalIcon.textContent = "🌿";
      modalBadge.style.background = "#fff3e0";
      modalBadge.style.color = "#e65100";
      modalBadge.textContent = "綠色探索小達人";
      modalMsg.textContent = "表現不錯喔！已經掌握了基礎重點。\n建議多複習「完全花」與「果實形成由子房發育」的觀念，再來挑戰一次！";
      playTrySound();
    } else {
      modalIcon.textContent = "🌱";
      modalBadge.style.background = "#fbe9e7";
      modalBadge.style.color = "#d84315";
      modalBadge.textContent = "發芽實習生";
      modalMsg.textContent = "別氣餒！自然科學多觀察幾次就會更熟悉。\n仔細閱讀下方每一題的「重點解析」，整理好筆記後再來挑戰滿分！";
      playTrySound();
    }

    document.getElementById("scoreModal").classList.add("active");
  }

  function closeModal() {
    document.getElementById("scoreModal").classList.remove("active");
  }

  function restartQuiz() {
    closeModal();
    for (let key in userAnswers) delete userAnswers[key];

    document.querySelectorAll(".q-card").forEach(c => {
      c.classList.remove("is-correct", "is-wrong");
    });
    document.querySelectorAll(".explanation").forEach(e => {
      e.classList.remove("show");
    });
    document.querySelectorAll(".option-item").forEach(l => {
      l.classList.remove("selected");
    });
    document.querySelectorAll("input[type=radio]").forEach(r => {
      r.checked = false;
    });

    updateProgress();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  window.addEventListener("DOMContentLoaded", renderQuiz);
</script>

</body>
</html>
